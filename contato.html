</head>
<body>

            </ul>

    <section id="contato">
        <div class="container">
            <h2>Entre em Contato</h2>
            
            <div class="contact-grid">
                <div class="contact-card">
                    <h3><i class="fas fa-info-circle"></i> Informações de Contato</h3>
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                        <div class="contact-details">
                            <strong>Email</strong>
                            <p>rodrigo.calabria@live.com</p>
                        </div>
                    </div>
                    
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fas fa-phone"></i></div>
                        <div class="contact-details">
                            <strong>Telefone</strong>
                            <p>(11) 91936-2237</p>
                        </div>
                    </div>
                </div>

                <div class="contact-card">
                    <h3><i class="fas fa-globe"></i> Redes Sociais</h3>
                    <div class="social-links">
                        <a href="https://www.linkedin.com/in/rodrigocalabria/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                            <span class="social-icon"><i class="fab fa-linkedin fa-2x"></i></span>
                        </a>
                        <a href="https://github.com/Rcalabri" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                            <span class="social-icon"><i class="fab fa-github fa-2x"></i></span>
                        </a>
                        <a href="https://www.instagram.com/tranks_rodrigo/" class="social-link" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                            <span class="social-icon"><i class="fab fa-instagram fa-2x"></i></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <button class="toggle-tema" onclick="alternarTema()">🌙</button>

    <script>
        document.getElementById('mobile-menu').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('active');
        });

        function alternarTema() {
            const temaAtual = document.body.getAttribute('data-tema') || 'light';
            const novoTema = temaAtual === 'light' ? 'dark' : 'light';
            const iconeTema = novoTema === 'dark' ? '☀️' : '🌙';
            
            document.body.setAttribute('data-tema', novoTema);
            document.querySelector('.toggle-tema').textContent = iconeTema;
            localStorage.setItem('tema', novoTema);
        }
        
        const temaSalvo = localStorage.getItem('tema');
        if (temaSalvo) {
            document.body.setAttribute('data-tema', temaSalvo);
            document.querySelector('.toggle-tema').textContent = temaSalvo === 'dark' ? '☀️' : '🌙';
        }
    </script>
    
    <style>
        .social-links {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: transparent;
            border-radius: 10px;
            text-decoration: none;
            color: var(--cor-texto);
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .social-link:hover {
            background: transparent;
            transform: translateY(-3px);
            border-color: transparent;
        }

        .social-icon {
            font-size: 1.2rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cor-primaria);
            transition: all 0.3s ease;
        }

        .social-link:hover .social-icon {
            color: var(--cor-secundaria);
            transform: scale(1.2);
        }
        
        .social-icon i {
            font-size: 2rem;
        }

        @media (max-width: 768px) {
            .social-links {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</body>

</html>
